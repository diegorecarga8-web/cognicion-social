<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="250mm" height="300mm">
<!-- JDCEL Bq · Luz y sombra · frente 25 x 30 cm (1 unidad = 0,5 mm). Los 3,6 cm superiores (y < 72) son la boca que se dobla hacia adentro. Monograma JJ aproximado: reemplazar por el vector original. -->
<style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Playfair+Display:wght@900&amp;family=Playball&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap');</style>
<defs>
  <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="600"><stop offset="0" stop-color="#424242"/><stop offset=".45" stop-color="#2b2b2b"/><stop offset="1" stop-color="#222222"/></linearGradient>
  <filter id="emboss" x="-8%" y="-8%" width="116%" height="116%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/><feOffset in="b" dx="2" dy="2.4" result="bo"/><feFlood flood-color="#000" flood-opacity=".34"/><feComposite in2="bo" operator="in" result="sh"/><feOffset in="b" dx="-1.6" dy="-1.8" result="ho"/><feFlood flood-color="#fff" flood-opacity="1"/><feComposite in2="ho" operator="in" result="hl"/><feMerge><feMergeNode in="sh"/><feMergeNode in="hl"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="cL"><rect x="0" y="0" width="250" height="600"/></clipPath>
  <clipPath id="cR"><rect x="250" y="0" width="250" height="600"/></clipPath>
  
</defs>
<rect width="500" height="600" fill="#ffffff"/>
<rect x="0" y="0" width="250" height="600" fill="#161616"/>
<g clip-path="url(#cL)"><g font-family="Playfair Display" font-weight="900" font-size="172" text-anchor="middle">
  <text x="229.36" y="230.92" fill="#f4f4f2">J</text>
  <text x="280.96" y="265.32" fill="#f4f4f2" stroke="#161616" stroke-width="7.74" stroke-linejoin="round" paint-order="stroke">J</text>
</g>
<text x="250" y="410" font-family="Archivo" font-weight="900" style="font-stretch:125%" font-size="60" fill="#f4f4f2" text-anchor="middle">JDCEL</text>
<text x="250" y="456" font-family="Playball" font-size="46" fill="#f4f4f2" text-anchor="middle">Bq</text>
<text x="250" y="540" font-family="EB Garamond" font-size="23" fill="#f4f4f2" text-anchor="middle">bendecidos para bendecir</text></g>
<g clip-path="url(#cR)"><g font-family="Playfair Display" font-weight="900" font-size="172" text-anchor="middle">
  <text x="229.36" y="230.92" fill="#111111">J</text>
  <text x="280.96" y="265.32" fill="#111111" stroke="#f6f6f4" stroke-width="7.74" stroke-linejoin="round" paint-order="stroke">J</text>
</g>
<text x="250" y="410" font-family="Archivo" font-weight="900" style="font-stretch:125%" font-size="60" fill="#111111" text-anchor="middle">JDCEL</text>
<text x="250" y="456" font-family="Playball" font-size="46" fill="#111111" text-anchor="middle">Bq</text>
<text x="250" y="540" font-family="EB Garamond" font-size="23" fill="#111111" text-anchor="middle">bendecidos para bendecir</text></g>
</svg>
