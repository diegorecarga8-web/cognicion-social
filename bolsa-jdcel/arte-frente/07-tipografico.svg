<text x="178" y="520" font-family="Playball" font-size="26" fill="#111111" text-anchor="start">Bq</text>
<text x="456" y="517" font-family="EB Garamond" font-style="italic" font-size="16" fill="#111111" text-anchor="end">Génesis 12:2</text>
